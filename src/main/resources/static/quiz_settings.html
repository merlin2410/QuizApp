<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz Settings - Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav>
            <a href="admin.html">Add Student</a> |
            <a href="results.html">View Results</a> |
            <a href="add_question.html">Add Question</a> |
            <a href="quiz_settings.html">Quiz Settings</a> |
            <a href="#" id="logout-link">Logout</a>
        </nav>
        <h1>Quiz Settings</h1>
        <div id="create-quiz-container">
            <h2>Create New Quiz</h2>
            <form id="create-quiz-form">
                <label for="quizTitle">Quiz Title:</label>
                <input type="text" id="quizTitle" name="quizTitle" required>
                <label for="totalTime">Total Time (minutes):</label>
                <input type="number" id="totalTime" name="totalTime" min="1" required>
                <button type="submit">Create Quiz</button>
            </form>
            <p id="create-success-message" class="success"></p>
        </div>
        <div id="existing-quizzes-container">
            <h2>Existing Quizzes</h2>
            <ul id="quiz-list"></ul>
        </div>
    </div>
    <script src="quiz_settings.js"></script>
</body>
</html>
