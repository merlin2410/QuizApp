<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">
    <title>Admin - Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav>
            <a href="admin.html">Add Student</a> |
            <a href="results.html">View Results</a> |
            <a href="add_question.html">Add Question</a> |
            <a href="#" id="logout-link">Logout</a>
        </nav>
        <h1>Add New Student</h1>
        <form id="add-student-form">

            <button type="submit">Add Student</button>
        </form>
        <p id="success-message" class="success"></p>
        <div style="text-align: center; margin-top: 1rem;">
            <a href="login.html">Go to Student Login</a>
        </div>
    </div>
